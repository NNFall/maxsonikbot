services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "${MAX_WEBHOOK_PORT:-8080}:${MAX_WEBHOOK_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    environment:
      DATABASE_PATH: /app/data/database.db
      MEDIA_TEMP_DIR: /app/media/temp
      FFMPEG_PATH: ffmpeg
